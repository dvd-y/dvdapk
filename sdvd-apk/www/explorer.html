        :root {
            --chrome-bg: #dee1e6;
            --chrome-toolbar: #ffffff;
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--chrome-bg);
            overflow: hidden;
        }

        /* סרגל טאבים */
        .tabs-container { display: flex; align-items: flex-end; padding: 8px 8px 0; gap: 4px; background: #dee1e6; }
        .tab {
            background: #bdc1c6; padding: 8px 15px; border-radius: 8px 8px 0 0;
            font-size: max(1rem, calc(12px * var(--fs-scale))); min-width: 130px; display: flex; align-items: center; 
            justify-content: space-between; cursor: pointer; border: none; position: relative;
        }
        .tab.active { background: white; color: black; z-index: 2; }
        .tab-close { font-size: max(1rem, calc(14px * var(--fs-scale))); margin-right: 10px; opacity: 0.6; }
        .tab-close:hover { opacity: 1; color: var(--google-red); }
        .add-tab-btn { background: none; border: none; font-size: calc(20px * var(--fs-scale)); cursor: pointer; padding: 5px 10px; color: #5f6368; }

        /* סרגל כלים (Toolbar) */
        .toolbar {
            background: white; padding: 5px 10px; display: flex; align-items: center; 
            gap: 12px; border-bottom: 1px solid #dfe1e5;
        }
        .nav-group { display: flex; gap: 8px; }
        .nav-btn { background: none; border: none; font-size: calc(18px * var(--fs-scale)); color: #5f6368; cursor: pointer; border-radius: 50%; width: 34px; height: 34px; }
        .nav-btn:hover { background: #f1f3f4; }
        
        .address-bar {
            flex-grow: 1; background: #f1f3f4; border-radius: 25px; padding: 7px 18px;
            display: flex; align-items: center; gap: 10px; border: 1px solid transparent;
        }
        .address-bar:focus-within { background: white; border-color: var(--google-blue); box-shadow: 0 0 5px rgba(66,133,244,0.3); }
        .address-bar input { border: none; background: none; width: 100%; outline: none; font-size: max(1rem, calc(14px * var(--fs-scale))); }

        /* שורת סימניות */
        .bookmarks-bar { background: white; padding: 5px 15px; display: flex; gap: 15px; font-size: max(1rem, calc(13px * var(--fs-scale))); border-bottom: 1px solid #dfe1e5; }
        .bookmark { cursor: pointer; color: #3c4043; display: flex; align-items: center; gap: 5px; }
        .bookmark:hover { text-decoration: underline; }

        /* אזור התוכן */
        .content-main { height: calc(100vh - 120px); position: relative; background: white; }
        .iframe-layer { width: 100%; height: 100%; border: none; display: none; }

        /* דף הבית (New Tab) */
        .home-screen {
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center;
            padding-top: 60px; background-size: cover; background-position: center; transition: 0.4s;
        }
        .home-content { 
            background: rgba(255,255,255,0.9); padding: 40px; border-radius: 20px; 
            text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); backdrop-filter: blur(5px);
        }
        .logo-text { font-size: calc(50px * var(--fs-lg)); font-weight: bold; margin-bottom: 20px; font-family: 'Product Sans', Arial; }

        /* כפתור התאמה אישית */
        .customize-btn {
            position: absolute; bottom: 20px; left: 20px;
            background: white; border: 1px solid #dfe1e5; padding: 8px 15px;
            border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: max(1rem, calc(13px * var(--fs-scale)));
        }
        .customize-btn:hover { background: #f8f9fa; }

        .bg-menu {
            position: absolute; bottom: 60px; left: 20px; background: white; 
            border: 1px solid #ccc; border-radius: 10px; padding: 10px; display: none; flex-direction: column; gap: 5px; z-index: 100;
        }
        .bg-option { padding: 8px; cursor: pointer; border-radius: 5px; }
        .bg-option:hover { background: #eee; }

    
/* ===== גופן, גודל, קריאות ורספונסיביות ===== */
:root{--fs-scale:1.7;--fs-lg:calc(1 + (var(--fs-scale) - 1) * 0.5);}

            "html": "https://dvdhtml.netlify.app",
            "טטריס": "https://detris.netlify.app",
            "קוביה": "https://dvdcube.netlify.app"
        };

        const bgUrls = {
            "1": "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1600",
            "2": "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600",
            "3": "https://images.unsplash.com/photo-1477346611705-65d1883cee1e?w=1600"
        };

        let tabs = [];
        let activeId = null;

        function addNewTab() {
            const id = Date.now();
            tabs.push({ id, url: '', title: 'טאב חדש' });
            switchTab(id);
        }

        function switchTab(id) {
            activeId = id;
            const tab = tabs.find(t => t.id === id);
            document.getElementById('url-input').value = tab.url;
            
            const view = document.getElementById('main-view');
            view.innerHTML = '';

            if (tab.url === '') {
                const currentBg = localStorage.getItem('dvd_explorer_bg');
                const bgStyle = currentBg && currentBg !== 'none' ? `background-image:url(${bgUrls[currentBg]})` : 'background:white';
                
                view.innerHTML = `
                    <div class="home-screen" style="${bgStyle}">
                        <div class="home-content">
                            <div class="logo-text">
                                <span style="color:var(--google-blue)">D</span><span style="color:var(--google-red)">V</span><span style="color:var(--google-yellow)">D</span>
                                <span style="color:var(--google-blue)">E</span><span style="color:var(--google-green)">x</span><span style="color:var(--google-red)">p</span>
                            </div>
                            <p style="color:#5f6368">איזה אתר של דוד נחקור היום?</p>
                        </div>
                    </div>`;
            } else {
                const ifr = document.createElement('iframe');
                ifr.className = 'iframe-layer';
                ifr.style.display = 'block';
                ifr.src = tab.url;
                view.appendChild(ifr);
            }
            renderTabs();
        }

        function renderTabs() {
            const bar = document.getElementById('tabs-bar');
            bar.querySelectorAll('.tab').forEach(n => n.remove());
            tabs.forEach(t => {
                const div = document.createElement('div');
                div.className = `tab ${t.id === activeId ? 'active' : ''}`;
                div.onclick = () => switchTab(t.id);
                div.innerHTML = `<span>🌐 ${t.title}</span><span class="tab-close" onclick="closeTab(event, ${t.id})">×</span>`;
                bar.insertBefore(div, bar.lastElementChild);
            });
        }

        function navigateTo(e) {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                const tab = tabs.find(t => t.id === activeId);
                tab.url = mySites[val] || (val.startsWith('http') ? val : 'https://' + val);
                tab.title = val;
                switchTab(activeId);
            }
        }

        function quickNav(name) {
            const tab = tabs.find(t => t.id === activeId);
            tab.url = mySites[name];
            tab.title = name;
            switchTab(activeId);
        }

        function closeTab(e, id) {
            e.stopPropagation();
            tabs = tabs.filter(t => t.id !== id);
            if (tabs.length === 0) addNewTab();
            else if (activeId === id) switchTab(tabs[0].id);
            else renderTabs();
        }

        function goHome() {
            const tab = tabs.find(t => t.id === activeId);
            tab.url = ''; tab.title = 'טאב חדש';
            switchTab(activeId);
        }

        function refreshPage() { switchTab(activeId); }
        function goBack() { goHome(); }

        /* ניהול רקעים */
        function toggleBgMenu() {
            const menu = document.getElementById('bg-menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function changeBg(type) {
            localStorage.setItem('dvd_explorer_bg', type);
            document.getElementById('bg-menu').style.display = 'none';
            switchTab(activeId);
        }

        // הפעלה
        addNewTab();
    </script>
